name: Build Windows Portable EXE & Windows 11 Store MSIX

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Pure Native Qt6 Windows (.EXE + Win11 .MSIX)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Native Qt6 (PySide6) & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Portable .EXE & Windows 11 Store .MSIX
        shell: powershell
        run: .\scripts\build-windows.ps1

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sirag-Atlas-Windows-Packages
          path: |
            dist/Sirag-Atlas-Seerah-Portable-x64.exe
            dist/Sirag-Atlas-Seerah-Win11-Store-x64.msix
            dist/Sirag-Atlas-Win11-Store.cer

      - name: Publish Ready-to-Download GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "سراج أطلس السيرة النبوية ${{ github.ref_name }} — ويندوز"
          body: |
            ## 🪟 سراج أطلس السيرة النبوية ﷺ (${{ github.ref_name }})
            **عن المطور:** [محمد صلاح عبد الخالق](https://elkatebmohamadsalah.blogspot.com/?m=1#google_vignette)

            ### 📦 النسختان الجاهزتان للتحميل:
            1. ⚡ **`Sirag-Atlas-Seerah-Portable-x64.exe`** — نسخة محمولة تعمل مباشرة بدون تثبيت.
            2. 🛍️ **`Sirag-Atlas-Seerah-Win11-Store-x64.msix`** — حزمة متجر ويندوز 11 (`MSIX`).
          files: |
            dist/Sirag-Atlas-Seerah-Portable-x64.exe
            dist/Sirag-Atlas-Seerah-Win11-Store-x64.msix
            dist/Sirag-Atlas-Win11-Store.cer
