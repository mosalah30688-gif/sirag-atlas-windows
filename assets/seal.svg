<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="الختم النبوي الشريف - محمد رسول الله">
  <defs>
    <radialGradient id="sealGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="75%" stop-color="#B38728"/>
      <stop offset="100%" stop-color="#6E4F12"/>
    </radialGradient>
    <radialGradient id="sealCore" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#152336"/>
      <stop offset="75%" stop-color="#0A121E"/>
      <stop offset="100%" stop-color="#05080F"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer scalloped octagonal-inspired astrolabe ring -->
  <circle cx="120" cy="120" r="112" fill="url(#sealCore)" stroke="url(#sealGold)" stroke-width="5"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="url(#sealGold)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.85"/>
  <circle cx="120" cy="120" r="94" fill="url(#sealCore)" stroke="url(#sealGold)" stroke-width="2.5"/>

  <!-- Cardinal compass ticks -->
  <g stroke="url(#sealGold)" stroke-width="2.2" opacity="0.9">
    <line x1="120" y1="8" x2="120" y2="20"/>
    <line x1="120" y1="220" x2="120" y2="232"/>
    <line x1="8" y1="120" x2="20" y2="120"/>
    <line x1="220" y1="120" x2="232" y2="120"/>
  </g>

  <!-- Authentic Three-Line Order of the Prophetic Seal (Bottom-up reading: محمد / رسول / الله) -->
  <g fill="url(#sealGold)" filter="url(#glow)" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', serif" font-weight="700">
    <text x="120" y="84" font-size="38" letter-spacing="1">اللّٰه</text>
    <text x="120" y="132" font-size="36" letter-spacing="1">رَسُولُ</text>
    <text x="120" y="180" font-size="38" letter-spacing="1">مُحَمَّدٌ</text>
  </g>

  <!-- Subtle decorative dividers -->
  <path d="M72 96 Q120 101 168 96" fill="none" stroke="url(#sealGold)" stroke-width="1" opacity="0.45"/>
  <path d="M72 145 Q120 150 168 145" fill="none" stroke="url(#sealGold)" stroke-width="1" opacity="0.45"/>
</svg>
